name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI Code Review Bot
        # Replace "your-username/ai-code-review-bot@v1" with a published
        # tag once you push this repo, or use "./" if this workflow lives
        # in the same repo as action.yml.
        uses: your-username/ai-code-review-bot@v1
        with:
          gemini_key: ${{ secrets.GEMINI_API_KEY }}
          # llm_provider: groq
          # groq_key: ${{ secrets.GROQ_API_KEY }}
          max_diff_lines: "2000"
